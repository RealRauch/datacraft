name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Detect workspace
    runs-on: ubuntu-latest
    outputs:
      has_workspace: ${{ steps.detect.outputs.has_workspace }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: echo "has_workspace=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  fmt:
    name: Formatting (rustfmt)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Lints (clippy, deny warnings)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: preflight
    if: needs.preflight.outputs.has_workspace == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # H55 diagnosis (released 2026-11-07): the ubuntu test job died twice
      # with `ld terminated with signal 7 [Bus error]` while linking core
      # test binaries — the classic disk-exhaustion symptom on the migrated
      # ubuntu-26 image. Record the disk state and free the preinstalled
      # tooling this build never uses; the df lines stay in the log as
      # evidence for the closure decision.
      - name: Disk evidence and headroom (H55)
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /
      - run: cargo test --workspace --all-features

  fixtures:
    name: Fixture pin integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned fixture hashes (docs/FIXTURE-SOURCES.md §6)
        run: cd fixtures && grep -v '^#' manifest | sha256sum -c -

  boundaries:
    name: Dependency boundary guard (AGENTS §1)
    needs: preflight
    if: needs.preflight.outputs.has_workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      # The guard validates itself first (L32): a broken boundary must
      # fail the guard, or the real check proves nothing.
      - name: Self-test
        run: python3 .github/scripts/dependency_boundaries.py --self-test
      - name: The current tree passes
        run: python3 .github/scripts/dependency_boundaries.py .

  docs:
    name: Rustdoc gate (-D warnings)
    needs: preflight
    if: needs.preflight.outputs.has_workspace == 'true'
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: cargo doc --workspace --all-features --no-deps --locked

  oracle:
    name: Oracle (mdb-tools cross-check)
    needs: preflight
    if: needs.preflight.outputs.has_workspace == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DATACRAFT_ORACLE_MDB: fixtures/testV2000.mdb,fixtures/testV2007.accdb,fixtures/testV2010.accdb,fixtures/attachmentsV2016.accdb
    steps:
      - uses: actions/checkout@v4
      # ubuntu: distro package; macOS: homebrew (windows has no mdbtools
      # package — the oracle runs on ubuntu/macOS only, see tests/oracle.rs).
      - run: sudo apt-get update && sudo apt-get install -y mdbtools
        if: runner.os == 'Linux'
      - run: brew install mdbtools
        if: runner.os == 'macOS'
      - run: cargo test -p datacraft-jet --test oracle -- --nocapture

  coverage:
    name: Coverage gate (>= 95% lines)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add llvm-tools-preview
      # Pinned (M51, step 43.2): a new upstream release must never move the
      # gate number without a code change. Bump deliberately, together with
      # the local dev setup — never passively via @latest.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      # --exclude datacraft-ui: registered coverage exception #1 (docs/TESTING.md §3)
      - run: cargo llvm-cov --workspace --exclude datacraft-ui --lcov --output-path lcov.info
      # The 95 % line gate is evaluated explicitly from the exported lcov
      # (identical definition to the local canonical set) instead of
      # --fail-under-lines: the tool's embedded threshold check diverged
      # from its own lcov export (run 41727473021 exported 96.42 % yet
      # exited 1), so the gate must not depend on the tool's version.
      - name: Line coverage gate (>= 95 %)
        run: |
          python3 - <<'PY'
          import re
          hit = found = 0
          with open('lcov.info', encoding='utf-8', errors='replace') as report:
              for line in report:
                  m = re.match(r'DA:(\d+),(\d+)', line)
                  if m:
                      found += 1
                      if int(m.group(2)) > 0:
                          hit += 1
          rate = 100 * hit / found
          print(f'line coverage: {hit}/{found} = {rate:.3f} %')
          assert rate >= 95, 'coverage gate failed: line coverage below 95 %'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info

  file-size:
    name: Hygiene gates (< 500 lines, no debt markers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce no technical-debt markers (TODO/FIXME/HACK/XXX)
        run: |
          set -euo pipefail
          # Exclusions are the rule's own definition sites (PLAYBOOK §5, README
          # quality-gates table, this job) and the append-only archives, which
          # are exempt history and must never be edited (PLAYBOOK §3/§5).
          if git grep -nIE '\b(TODO|FIXME|HACK|XXX)\b' -- \
              . ':(exclude).github/workflows/ci.yml' ':(exclude)docs/PLAYBOOK.md' ':(exclude)README.md' \
              ':(exclude)docs/archive/**'; then
            echo "::error::Technical-debt markers found — rule 'no technical debt' (docs/PLAYBOOK.md §5)"
            exit 1
          fi
          echo "OK: no technical-debt markers in tracked files."
      - name: Enforce 500-line limit on Rust sources
        run: |
          set -euo pipefail
          oversized=$(find . -name '*.rs' -not -path './target/*' -not -path './.git/*' -exec wc -l {} \; | awk '$1 >= 500 {print $2}')
          if [ -n "$oversized" ]; then
            echo "::error::Rust source files with 500 or more lines:"
            echo "$oversized"
            exit 1
          fi
          echo "OK: all Rust source files are below the 500-line limit."
