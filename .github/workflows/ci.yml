name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Detect workspace
    runs-on: ubuntu-latest
    outputs:
      has_workspace: ${{ steps.detect.outputs.has_workspace }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: echo "has_workspace=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  fmt:
    name: Formatting (rustfmt)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Lints (clippy, deny warnings)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: preflight
    if: needs.preflight.outputs.has_workspace == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --workspace --all-features

  fixtures:
    name: Fixture pin integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned fixture hashes (docs/FIXTURE-SOURCES.md §6)
        run: cd fixtures && grep -v '^#' manifest | sha256sum -c -

  oracle:
    name: Oracle (mdb-tools cross-check)
    needs: preflight
    if: needs.preflight.outputs.has_workspace == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DATACRAFT_ORACLE_MDB: fixtures/testV2000.mdb
    steps:
      - uses: actions/checkout@v4
      # ubuntu: distro package; macOS: homebrew (windows has no mdbtools
      # package — the oracle runs on ubuntu/macOS only, see tests/oracle.rs).
      - run: sudo apt-get update && sudo apt-get install -y mdbtools
        if: runner.os == 'Linux'
      - run: brew install mdbtools
        if: runner.os == 'macOS'
      - run: cargo test -p datacraft-storage --test oracle -- --nocapture

  coverage:
    name: Coverage gate (>= 95% lines)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.has_workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # --exclude datacraft-ui: registered coverage exception #1 (docs/TESTING.md §3)
      - run: cargo llvm-cov --workspace --exclude datacraft-ui --lcov --output-path lcov.info --fail-under-lines 95
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info

  file-size:
    name: Hygiene gates (< 500 lines, no debt markers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce no technical-debt markers (TODO/FIXME/HACK/XXX)
        run: |
          set -euo pipefail
          # Exclusions are the rule's own definition sites (PLAYBOOK §5, README
          # quality-gates table, this job) — everything else is fully scanned.
          if git grep -nIE '\b(TODO|FIXME|HACK|XXX)\b' -- \
              . ':(exclude).github/workflows/ci.yml' ':(exclude)docs/PLAYBOOK.md' ':(exclude)README.md'; then
            echo "::error::Technical-debt markers found — rule 'no technical debt' (docs/PLAYBOOK.md §5)"
            exit 1
          fi
          echo "OK: no technical-debt markers in tracked files."
      - name: Enforce 500-line limit on Rust sources
        run: |
          set -euo pipefail
          oversized=$(find . -name '*.rs' -not -path './target/*' -not -path './.git/*' -exec wc -l {} \; | awk '$1 >= 500 {print $2}')
          if [ -n "$oversized" ]; then
            echo "::error::Rust source files with 500 or more lines:"
            echo "$oversized"
            exit 1
          fi
          echo "OK: all Rust source files are below the 500-line limit."
