[workspace]
resolver = "3"
members = [
    "crates/datacraft-cli",
    "crates/datacraft-core",
    "crates/datacraft-csv",
    "crates/datacraft-jet",
    "crates/datacraft-mcp",
    "crates/datacraft-sqlite",
    "crates/datacraft-storage",
    "crates/datacraft-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["DataCraft contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
datacraft-cli = { path = "crates/datacraft-cli" }
datacraft-core = { path = "crates/datacraft-core" }
datacraft-csv = { path = "crates/datacraft-csv" }
datacraft-jet = { path = "crates/datacraft-jet" }
datacraft-mcp = { path = "crates/datacraft-mcp" }
datacraft-sqlite = { path = "crates/datacraft-sqlite" }
datacraft-storage = { path = "crates/datacraft-storage" }
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
