[workspace]
resolver = "3"
members = [
    "crates/datacraft-core",
    "crates/datacraft-storage",
    "crates/datacraft-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["DataCraft contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
datacraft-core = { path = "crates/datacraft-core" }
datacraft-storage = { path = "crates/datacraft-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1
