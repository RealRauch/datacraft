<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    DataCraft app icon: a database cylinder whose front is a datasheet.
    Crafting Apps office-icon grammar (WordCraft, GridCraft, DeckCraft):
    512-unit tile, rounded square rx=112, full-bleed app colour, exactly three colours.
    Ink #0B0B0C - line work and contour
    Paper #EFE9DC - the cylinder and the datasheet
    DataCraft teal #0F8B7E - the full-bleed field and the datasheet header
    Original geometry, hand-written; no vendor database logo is copied.
  -->
  <defs>
    <clipPath id="tile">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="#0F8B7E"/>

    <g transform="rotate(-6 256 256)" stroke="#0B0B0C" stroke-linejoin="round" stroke-linecap="round">
      <!-- cylinder body -->
      <path d="M 118 120 V 392 A 138 44 0 0 0 394 392 V 120 Z" fill="#EFE9DC" stroke="none"/>
      <path d="M 118 120 V 392 A 138 44 0 0 0 394 392 V 120" fill="none" stroke-width="14"/>

      <!-- top disk and inner rim -->
      <ellipse cx="256" cy="120" rx="138" ry="40" fill="#EFE9DC" stroke-width="14"/>
      <ellipse cx="256" cy="120" rx="104" ry="26" fill="none" stroke-width="8"/>

      <!-- datasheet: header row in the app colour, four record rows -->
      <rect x="148" y="190" width="216" height="158" fill="#EFE9DC" stroke-width="12"/>
      <rect x="148" y="190" width="216" height="30" fill="#0F8B7E" stroke="none"/>
      <path d="M 220 190 V 348 M 292 190 V 348 M 148 220 H 364 M 148 252 H 364 M 148 284 H 364 M 148 316 H 364"
            fill="none" stroke-width="8"/>
      <rect x="220" y="252" width="72" height="32" fill="#0B0B0C" stroke="none"/>
    </g>
  </g>
</svg>
