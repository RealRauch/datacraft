[package]
name = "datacraft-jet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Clean-room pure-Rust Jet 3/4 and ACE backend for DataCraft (read path, Jet4 writer)"

[dependencies]
# default-features = false: the jet crate stays C-free — the shadow SQL
# engine's rusqlite lives behind the core's optional `sql-engine` feature
# (step 31.2 / M19). Declared directly (not via workspace inheritance)
# because an inherited dependency cannot override default-features.
datacraft-core = { path = "../datacraft-core", version = "0.1.1", default-features = false }
serde = { workspace = true }

[lints]
workspace = true
