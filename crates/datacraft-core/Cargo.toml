[package]
name = "datacraft-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "Headless domain model, command bus and application state for DataCraft"

[dependencies]
datacraft-expr = { workspace = true }
datacraft-query = { workspace = true }
datacraft-types = { workspace = true }
csv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pdf-writer = { workspace = true, optional = true }
ttf-parser = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }

[features]
default = []
# The shadow SQL engine lives in datacraft-query behind that crate's own
# `sql-engine` feature (step 76.4, item L37); this switch forwards to it.
# A default-feature core stays rusqlite-free — the query layer, the
# expression service and the type vocabulary carry no C dependency.
sql-engine = ["datacraft-query/sql-engine"]
# PDF report export (phase 97, item M128): the pure-Rust writer and font
# parser stay optional, the sql-engine precedent — a default-feature core
# carries neither. The three client roots enable this feature.
pdf-export = ["dep:pdf-writer", "dep:ttf-parser"]

[[test]]
name = "sql_engine"
required-features = ["sql-engine"]

[[test]]
name = "sql_command"
required-features = ["sql-engine"]

[[test]]
name = "native_views"
required-features = ["sql-engine"]

[[test]]
name = "pdf_export"
required-features = ["pdf-export"]

[lints]
workspace = true
